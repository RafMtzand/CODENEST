<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ContactoCN</title>
  <link rel="stylesheet" href="css5555.css">
</head>
<body>
  <div class="contact-wrapper">
    <div class="contact-card">
      <h2>Contáctanos</h2>
      <p>¿Tienes dudas, ideas o simplemente quieres saludarnos? ¡Aquí estamos!</p>
      <form href="php-login/profile.php" method="post">
        <div class="form-field">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
        </div>
        <div class="form-field">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="form-field">
          <label for="tema">Tema del mensaje</label>
          <select id="tema" name="tema" required>
            <option value="" disabled selected>Selecciona un tema</option>
            <option value="sugerencia">Sugerencia</option>
            <option value="reporte">Reporte de error</option>
            <option value="pregunta">Pregunta</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="form-field">
          <label for="mensaje">Mensaje</label>
          <textarea id="mensaje" name="mensaje" rows="5" placeholder="Escribe tu mensaje..." required></textarea>
        </div>
        <button href="php-login/profile.php" type="submit">Enviar mensaje</button>
      </form>
    </div>
  </div>
</body>
</html>
